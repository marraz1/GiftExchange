<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Snowflake (large) -->
  <g transform="translate(62 70)" stroke="#5ee7ff" stroke-opacity=".22" stroke-width="1.6">
    <g id="arm">
      <path d="M0 0V-26M0 -10l-6 -6M0 -10l6 -6M0 -19l-4 -4M0 -19l4 -4"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
  <!-- Snowflake (small) -->
  <g transform="translate(250 230) scale(.55)" stroke="#e8ecff" stroke-opacity=".2" stroke-width="2.4">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
  <!-- Christmas tree -->
  <g transform="translate(232 40)" stroke="#6ef2c0" stroke-opacity=".22" stroke-width="1.6">
    <path d="M24 0l14 18h-8l12 16h-9l13 18H-2l13-18H2l12-16H6z"/>
    <path d="M20 52v9h8v-9"/>
    <circle cx="24" cy="-4" r="2" fill="#f472b6" fill-opacity=".35" stroke="none"/>
  </g>
  <!-- Gift box -->
  <g transform="translate(110 200)" stroke="#f472b6" stroke-opacity=".24" stroke-width="1.6">
    <rect x="0" y="12" width="40" height="30" rx="3"/>
    <rect x="-3" y="5" width="46" height="9" rx="2"/>
    <path d="M20 5v37"/>
    <path d="M20 5c-4-8-14-8-13-2 1 4 9 3 13 2zM20 5c4-8 14-8 13-2-1 4-9 3-13 2z"/>
  </g>
  <!-- Small tree -->
  <g transform="translate(20 230) scale(.6)" stroke="#5ee7ff" stroke-opacity=".18" stroke-width="2.4">
    <path d="M24 0l14 18h-8l12 16h-9l13 18H-2l13-18H2l12-16H6z"/>
    <path d="M20 52v9h8v-9"/>
  </g>
  <!-- Small gift -->
  <g transform="translate(180 120) scale(.6)" stroke="#a78bfa" stroke-opacity=".24" stroke-width="2.4">
    <rect x="0" y="12" width="40" height="30" rx="3"/>
    <rect x="-3" y="5" width="46" height="9" rx="2"/>
    <path d="M20 5v37"/>
    <path d="M20 5c-4-8-14-8-13-2 1 4 9 3 13 2zM20 5c4-8 14-8 13-2-1 4-9 3-13 2z"/>
  </g>
  <!-- Stars -->
  <g fill="#e8ecff" fill-opacity=".35">
    <circle cx="150" cy="40" r="1.4"/>
    <circle cx="300" cy="150" r="1.2"/>
    <circle cx="90" cy="150" r="1"/>
    <circle cx="200" cy="300" r="1.4"/>
    <circle cx="30" cy="20" r="1"/>
  </g>
  <path d="M120 90l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#5ee7ff" fill-opacity=".3"/>
  <path d="M290 290l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#f472b6" fill-opacity=".3"/>
</svg>
